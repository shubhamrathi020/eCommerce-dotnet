name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # the "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  verify:
    name: Build, unit tests, and the shared integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce, POSTGRES_DB: ecommerce }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ["5672:5672"]
      meilisearch:
        image: getmeili/meilisearch:v1.54
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release
      - run: dotnet publish src/EcomApi/EcomApi.csproj -c Release -o publish

      # The Nest repository owns the schema and the integration specs; check it out and run those same specs
      # against the server published above.
      - uses: actions/checkout@v4
        with:
          repository: shubhamrathi020/eCommerce-api
          path: eCommerce-api

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eCommerce-api/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Nest repository (for its migrations and specs)
        working-directory: eCommerce-api
        run: pnpm install --frozen-lockfile && pnpm db:generate

      - name: Shared integration specs against the .NET server
        working-directory: eCommerce-api/apps/api
        env:
          API_BIN: dotnet
          API_ARGS: ${{ github.workspace }}/publish/EcomApi.dll
        run: pnpm exec vitest run test/

      # The schema now exists in the test database, so the tests that need it (the abandoned-cart job) can run too.
      - run: dotnet test -c Release
